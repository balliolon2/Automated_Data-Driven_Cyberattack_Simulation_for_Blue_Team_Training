host: localhost:8080
info:
  contact:
    name: SOC Trainer Development Team
  description: Automated Data-Driven Cyberattack Simulation for Blue Team Training
    platform REST API.
  license:
    name: MIT
  termsOfService: https://github.com/balliolon2/Automated_Data-Driven_Cyberattack_Simulation_for_Blue_Team_Training
  title: SOC Trainer REST API
  version: "1.0"
paths:
  /admin/evaluations:
    get:
      description: Returns learner cohort funnel counts, aggregate CSUQ/NASA-TLX summary
        stats, and pseudonymized individual evaluation rows without email PII.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminEvaluationsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List pseudonymized learner post-test evaluations and summary KPIs (Admin
        only)
      tags:
      - Admin
  /admin/evaluations/export:
    get:
      description: Streams RFC 4180 CSV bytes (default format=csv, with UTF-8 BOM
        and formula-injection neutralization) or returns AdminEvaluationsExportJSONResponse
        (format=json) for Excel, SPSS, or Python analysis.
      parameters:
      - default: csv
        description: Export format (csv or json)
        in: query
        name: format
        type: string
      produces:
      - text/csv
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminEvaluationsExportJSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Export pseudonymized learner evaluations as UTF-8 BOM CSV or JSON (Admin
        only)
      tags:
      - Admin
  /admin/evaluations/statistics:
    get:
      description: Computes descriptive statistics (Student-t 95% CI, R-7 IQR), Cronbach's
        alpha, Pre-to-Post Paired t-test (Cohen's d_z) and Wilcoxon signed-rank (rank-biserial
        r_rb), and Spearman rank correlations over learner evaluations.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminPaperStatisticsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get paper-ready statistical analysis report (Admin only)
      tags:
      - Admin
  /analytics/research-summary:
    get:
      consumes:
      - application/json
      description: Returns structured research and experiment metrics across pre-test,
        scenario loop, and post-test pursuant to the evaluation protocol.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResearchSummaryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get research evaluation summary
      tags:
      - Analytics
  /evaluation/questionnaire:
    post:
      consumes:
      - application/json
      description: Validates and records one CSUQ v3 + Raw NASA-TLX + qualitative
        evaluation per learner after completing the Post-Test, snapshotting Pre/Post
        and Skill Profile data server-side.
      parameters:
      - description: Questionnaire ratings and qualitative impressions
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.SubmitQuestionnaireRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SubmitQuestionnaireResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit post-test evaluation questionnaire
      tags:
      - Evaluation
  /exams/history:
    get:
      consumes:
      - application/json
      description: Returns all completed Pre-Test and Post-Test sessions ordered most-recent-first
        along with latest session shortcuts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExamHistoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List completed exam sessions for the authenticated learner
      tags:
      - Exams
  /exams/post-test:
    post:
      consumes:
      - application/json
      description: Initializes a 30-question Post-Test with zero overlap from the
        Pre-Test questions.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ExamSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start post-test exam session
      tags:
      - Exams
  /exams/pre-test:
    post:
      consumes:
      - application/json
      description: Initializes a 30-question Pre-Test with required domain distribution
        (4/7/5/8/6). If an in-progress pre-test already exists, returns the existing
        session.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ExamSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start or resume pre-test exam session
      tags:
      - Exams
  /exams/sample:
    get:
      consumes:
      - application/json
      description: Retrieves a random question from the database question pool for
        preview.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.QuestionDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get a sample exam question
      tags:
      - Exams
  /exams/session:
    get:
      consumes:
      - application/json
      description: Recovers the active exam session and questions for the authenticated
        learner.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExamSessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get active exam session
      tags:
      - Exams
  /exams/sessions/{sessionId}/finalize:
    post:
      consumes:
      - application/json
      description: Marks unanswered questions as incorrect, records elapsed time,
        transitions the session to completed, and returns full review results. Idempotent
        when already completed.
      parameters:
      - description: Exam Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Optional elapsed exam time
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.FinalizeExamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FinalizeExamResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Finalize an active exam session
      tags:
      - Exams
  /exams/sessions/{sessionId}/review:
    get:
      consumes:
      - application/json
      description: Returns score metrics, domain breakdown, ordered 30-question Q&A
        details with explanations and sub-topic metadata, and Pre-to-Post learning
        gains on Post-Tests. Strictly rejects in-progress sessions with 403 EXAM_NOT_COMPLETED.
      parameters:
      - description: Completed Exam Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExamReviewResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get complete Q&A review for a completed exam session
      tags:
      - Exams
  /exams/submit-answer:
    post:
      consumes:
      - application/json
      description: Commits an answer for an exam question and returns progression
        or final score results.
      parameters:
      - description: Exam Answer Submission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SubmitAnswerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SubmitAnswerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit an exam answer
      tags:
      - Exams
  /learn/domains:
    get:
      consumes:
      - application/json
      description: Returns the 5 CompTIA Security+ domain Theory Modules, learner
        proficiency context, and completion state. Learners must finish the Pre-Test
        first; Specialists and Admins always have access.
      parameters:
      - description: Language locale (en or th)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LearnDomainsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all five Security+ Theory Modules
      tags:
      - Learn
  /learn/domains/{domainId}/complete:
    post:
      consumes:
      - application/json
      description: Idempotently records that the authenticated user finished studying
        the specified domain Theory Module without altering Proficiency Score. For
        Learners, rejects with 403 subtopics_incomplete unless all child Sub-topics
        are completed.
      parameters:
      - description: Domain ID (domain1..domain5)
        in: path
        name: domainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CompleteTheoryDomainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a domain Theory Module as completed
      tags:
      - Learn
  /learn/subtopics/{subTopicId}:
    get:
      consumes:
      - application/json
      description: Returns the web-grounded Markdown lesson for a Security+ Sub-topic
        alongside 2 permanently assigned formative sample questions (drawn cleanly
        without overlap with Pre-Test or future Post-Test). Correct answers and explanations
        stay hidden until submitted.
      parameters:
      - description: Sub-topic ID (e.g. 1.1..5.6)
        in: path
        name: subTopicId
        required: true
        type: string
      - description: Language locale (en or th)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LearnSubtopicDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve a Sub-topic lesson and its 2 locked sample questions
      tags:
      - Learn
  /learn/subtopics/{subTopicId}/complete:
    post:
      consumes:
      - application/json
      description: Verifies that all assigned sample questions for the Learner in
        this Sub-topic have been attempted (400 sample_questions_incomplete otherwise),
        idempotently marks the Sub-topic complete, and automatically completes the
        parent domain when all child Sub-topics are done. Specialists/Admins receive
        preview_mode=true without database writes.
      parameters:
      - description: Sub-topic ID (e.g. 1.1..5.6)
        in: path
        name: subTopicId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CompleteSubtopicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a Sub-topic as completed (attempt-gated)
      tags:
      - Learn
  /learn/subtopics/{subTopicId}/sample-questions/{questionId}/attempt:
    post:
      consumes:
      - application/json
      description: Immediately evaluates a Learner's answer choice (A-D) for an assigned
        sample question, reveals the explanation, and locks the first submitted answer.
        Does not modify Proficiency Score.
      parameters:
      - description: Sub-topic ID (e.g. 1.1..5.6)
        in: path
        name: subTopicId
        required: true
        type: string
      - description: Assigned Sample Question UUID
        in: path
        name: questionId
        required: true
        type: string
      - description: Answer choice A-D
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AttemptSampleQuestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AttemptSampleQuestionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit an answer for a Sub-topic sample question
      tags:
      - Learn
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a signed JWT token
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new learner account with email, password, nickname, and
        optional preferred_language
      parameters:
      - description: User Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register a new learner
      tags:
      - Auth
  /simulation/log-query:
    post:
      consumes:
      - application/json
      description: Records a query action executed by the learner against telemetry
        logs for auditing and investigation scoring.
      parameters:
      - description: Log Query Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LogQueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Execute and record a telemetry log query
      tags:
      - Simulation
  /simulation/result/{sessionId}:
    get:
      consumes:
      - application/json
      description: Returns the complete evaluation breakdown, action audit trail,
        and updated domain proficiencies for a completed simulation session.
      parameters:
      - description: Simulation Session UUID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SimulationResultResponse'
            - properties:
                result:
                  $ref: '#/definitions/models.ScenarioResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get detailed retrospective result of a simulation session
      tags:
      - Simulation
  /simulation/select-log:
    post:
      consumes:
      - application/json
      description: Records a select_evidence toggle action for an in-progress simulation
        session and returns the replayed selection.
      parameters:
      - description: Evidence selection toggle
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SelectLogRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EvidenceSelectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Toggle one telemetry log as selected evidence
      tags:
      - Simulation
  /simulation/select-log/clear:
    post:
      consumes:
      - application/json
      description: Records one select_evidence clear action for an in-progress simulation
        session.
      parameters:
      - description: Clear evidence selection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ClearLogSelectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EvidenceSelectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Clear all selected evidence logs
      tags:
      - Simulation
  /simulation/session:
    get:
      consumes:
      - application/json
      description: Recovers the in-progress simulation session and scenario data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActiveSimulationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get active simulation session
      tags:
      - Simulation
  /simulation/start:
    post:
      consumes:
      - application/json
      description: Synthesizes or retrieves the next scenario focused on the learner's
        weakest domain. If an active simulation exists, resumes it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActiveSimulationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.TheoryGateErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start next adaptive simulation scenario
      tags:
      - Simulation
  /simulation/status:
    get:
      consumes:
      - application/json
      description: Returns per-domain proficiency status, completed scenario count,
        and training eligibility.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SimulationStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get learner simulation status
      tags:
      - Simulation
  /simulation/submit:
    post:
      consumes:
      - application/json
      description: Evaluates the learner's TP/FP classification, response actions,
        and discovered key findings, updating proficiency scores via weighted average.
      parameters:
      - description: Scenario Submission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SubmitScenarioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SubmitScenarioResponse'
            - properties:
                result:
                  $ref: '#/definitions/models.ScenarioResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit scenario response actions and triage decision
      tags:
      - Simulation
  /specialist/submissions:
    get:
      description: Returns completed simulation sessions with evidence review counters
        for specialist triage.
      parameters:
      - description: Filter by scenario ID
        in: query
        name: scenario_id
        type: string
      - description: Filter by security domain ID
        in: query
        name: domain_id
        type: string
      - description: Only include submissions at or below this final score
        in: query
        name: max_score
        type: number
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (1-100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SpecialistSubmissionSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List anonymized learner submissions
      tags:
      - Specialist
  /specialist/submissions/{session_id}:
    get:
      description: Returns the full investigation timeline plus the evidence review
        for one completed simulation session.
      parameters:
      - description: Simulation Session UUID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SpecialistSubmissionDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get specialist submission detail
      tags:
      - Specialist
  /user/language:
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's preferred UI language ('en' or
        'th')
      parameters:
      - description: Language Preference
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateLanguageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UpdateLanguageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user language preference
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGciOi..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
