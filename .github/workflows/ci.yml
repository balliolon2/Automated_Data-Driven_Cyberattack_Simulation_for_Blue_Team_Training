name: CI & DevSecOps Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-audit:
    name: Code Quality & DevSecOps Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Backend Lint & Vet
        run: |
          go vet ./...

      - name: Go Security Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend TypeScript Typecheck
        run: |
          cd frontend
          npx tsc -b

      - name: Frontend ESLint
        run: |
          cd frontend
          npm run lint

      - name: Frontend Dependency Vulnerability Audit
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-test:
    name: Database & Exam Test Harness
    needs: lint-and-audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: cyber_sim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Schema (init.sql)
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect('postgres://postgres:password123@localhost:5432/cyber_sim?sslmode=disable')
          with open('init.sql', 'r', encoding='utf-8') as f:
              conn.cursor().execute(f.read())
          conn.commit()
          conn.close()
          print('PostgreSQL schema initialized successfully!')
          "

      - name: Seed CompTIA Domains & Questions to DB
        env:
          DATABASE_URL: "postgres://postgres:password123@localhost:5432/cyber_sim?sslmode=disable"
        run: |
          python scripts/load_exams_to_db.py

      - name: Start Backend & Run Integration Test Harness
        env:
          DATABASE_URL: "postgres://postgres:password123@localhost:5432/cyber_sim?sslmode=disable"
          JWT_SECRET: "ci-test-jwt-secret-key-12345"
          ADMIN_EMAIL: "admin@soc.local"
          ADMIN_PASSWORD: "password"
          PORT: "8080"
          ENABLE_SWAGGER: "false"
        run: |
          go run main.go > backend.log 2>&1 &
          
          # Poll health check until backend responds healthy
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/health | grep -q "healthy"; then
              echo "Backend API is up and healthy!"
              break
            fi
            echo "Waiting for backend API startup ($i/30)..."
            sleep 1
          done

          if ! curl -s http://localhost:8080/api/health | grep -q "healthy"; then
            echo "Error: Backend API failed to start. Logs:"
            cat backend.log
            exit 1
          fi

          python scripts/test_integration.py

  build-validation:
    name: Production Build Verification
    needs: lint-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Backend Docker Image
        run: |
          docker build -t soc-trainer-backend:ci .
